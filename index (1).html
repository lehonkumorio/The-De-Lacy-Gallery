<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My 3D Model</title>
<!--
  SETUP
  1. Put your model next to this file as  model.gltf  (or change MODEL_URL below).
  2. Optional: for iPhone AR, add a USDZ version as  model.usdz  and add the attribute  ios-src="model.usdz"  to the <model-viewer> tag.
  3. Upload both files to your host (GitHub Pages, Netlify, etc.) and make a QR code of the page URL.
-->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: light; }
  :root { --bg:#ffffff; --fg:#1b2430; --muted:#5b6675; --accent:#1f5eff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  header { padding: 14px 18px 6px; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 650; }
  p.hint { margin: 2px 0 0; font-size: .9rem; color: var(--muted); }
  model-viewer {
    flex: 1; width: 100%; min-height: 0;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
  }
  .ar-btn {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .ar-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #error {
    display: none; margin: 18px; padding: 14px; border-radius: 8px;
    background: rgba(220,50,50,.12); font-size: .95rem;
  }
</style>
</head>
<body>
  <header>
    <h1>My 3D Model</h1>
    <p class="hint">Drag to rotate, pinch to zoom.</p>
  </header>

  <div id="error">The model could not be loaded. Check that <code>model_v3.gltf</code> is in the same folder as this page.</div>

  <model-viewer
    id="viewer"
    src="model_v3.gltf"
    alt="3D model"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    loading="eager">
    <button slot="ar-button" class="ar-btn">View in your space</button>
  </model-viewer>

<script>
  document.getElementById('viewer').addEventListener('error', function () {
    document.getElementById('error').style.display = 'block';
  });
</script>
</body>
</html>
